name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Test scripts quote `src/**/*.test.ts` so the shell cannot expand only
        # nested tests and omit top-level files. Node expands the glob (22+). Node 20 is
        # past EOL, so the floor here is deliberately above package.json engines.
        node: [22, 24]
    name: node ${{ matrix.node }}
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      WECHAT_AI_TEST_REDIS_URL: redis://127.0.0.1:6379/15
      REDIS_URL: redis://127.0.0.1:6379/14
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm -r typecheck

      - run: pnpm -r test

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Advisory only: a CVE published upstream should show up here, not break
      # an unrelated pull request.
      - run: pnpm audit --prod
        continue-on-error: true
